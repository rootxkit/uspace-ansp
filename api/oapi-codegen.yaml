# oapi-codegen v2.8.0 configuration for api/gen (docs/WORKPACKAGES/WP-3.md):
# the net/http (Go 1.22 routing) server interface, the strict server,
# the models and the Go client of api/openapi.yaml, in one file. Run
# through `make generate` (go generate ./api/gen, then scripts/generate.sh
# records the source hash); never edit api/gen by hand.
package: gen
generate:
  std-http-server: true
  strict-server: true
  models: true
  client: true
  embedded-spec: false
output-options:
  skip-prune: false
compatibility:
  # Enum constants carry their type name (RestrictionStateActive, not
  # Active), so an enum value never collides with a generated type.
  always-prefix-enum-values: true
