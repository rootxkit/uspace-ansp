# Development stack of uspace-ansp (docs/PLAN.md section 11), started by
# `make compose-up` and removed by `make compose-down`. Not production:
# WP-13 owns the production compose, Caddy and the published images.
#
# Ports are published on 127.0.0.1 only, in the 58xxx range so that the
# stacks of uspace-ussp (57xxx), uspace-authority (56xxx) and
# uspace-cisp can run beside it: api 58080, manned-feed 58081,
# manned-adapter 58082, PostgreSQL 58432, NATS 58422 (monitor 58822).
#
# local/dev.env (POSTGRES_PASSWORD) and local/nats/ (one NKey per
# process and nats.conf) are generated by the Makefile and
# scripts/nats-creds.sh and are git-ignored. No process migrates at
# start (M36): the one-shot `migrate` service runs both trees and the
# services that open a database wait for it to complete.
name: uspace-ansp

# The image is built once, by the migrate service, and used by all four.
x-ansp: &ansp
  image: uspace-ansp:dev
  pull_policy: never
  networks: [ansp]
  read_only: true

services:
  timescaledb:
    # One container, two databases (M37): ansp (relational, PostGIS) and
    # ansp_ts (TimescaleDB), separate databases with separate version
    # tables. Pinned like the CI service.
    image: timescale/timescaledb-ha:pg16@sha256:e9f34d8dd27621ec3933386eb07b70021d15b8116247362e0537bbff94ef0769
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make compose-up, which writes local/dev.env}
      POSTGRES_DB: ansp
    configs:
      - source: initdb
        target: /docker-entrypoint-initdb.d/10-ansp.sql
    volumes:
      - pgdata:/home/postgres/pgdata
    ports:
      - "127.0.0.1:58432:5432"
    networks: [ansp]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1", "-d", "ansp_ts"]
      interval: 2s
      timeout: 3s
      retries: 60

  nats:
    image: nats:2-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../local/nats/nats.conf:/etc/nats/nats.conf:ro
      - natsdata:/data
    ports:
      - "127.0.0.1:58422:4222"
      - "127.0.0.1:58822:8222"
    networks: [ansp]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *ansp
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/api", "migrate", "relational", "timeseries"]
    restart: "no"
    environment:
      ANSP_PROCESS: api
      ANSP_RELATIONAL_DSN: postgres://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/ansp?sslmode=disable
      ANSP_TIMESERIES_DSN: postgres://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/ansp_ts?sslmode=disable
    depends_on:
      timescaledb:
        condition: service_healthy

  api:
    <<: *ansp
    entrypoint: ["/api"]
    restart: unless-stopped
    environment:
      ANSP_PROCESS: api
      ANSP_INSTANCE: dev
      ANSP_NATS_URL: nats://nats:4222
      ANSP_NATS_CREDS: /run/secrets/nats.nk
      ANSP_RELATIONAL_DSN: postgres://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/ansp?sslmode=disable
      ANSP_TIMESERIES_DSN: postgres://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/ansp_ts?sslmode=disable
      ANSP_MTLS_MODE: "off"
      ANSP_LOG_LEVEL: info
    volumes:
      - ../local/nats/api.nk:/run/secrets/nats.nk:ro
    ports:
      - "127.0.0.1:58080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started

  manned-feed:
    <<: *ansp
    entrypoint: ["/manned-feed"]
    restart: unless-stopped
    environment:
      ANSP_PROCESS: manned-feed
      ANSP_INSTANCE: dev
      ANSP_NATS_URL: nats://nats:4222
      ANSP_NATS_CREDS: /run/secrets/nats.nk
      # The hypertable only: manned-feed never opens PostgreSQL's
      # relational database (CLAUDE.md rule 6).
      ANSP_TIMESERIES_DSN: postgres://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/ansp_ts?sslmode=disable
      ANSP_MTLS_MODE: "off"
    volumes:
      - ../local/nats/manned-feed.nk:/run/secrets/nats.nk:ro
    ports:
      - "127.0.0.1:58081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started

  # The replay adapter (WP-4): the synthetic converging pair of
  # testdata/replay, looped, mounted read-only (replay data is never in
  # the image). Replay runs only because it is allowed here (06 T11). It
  # opens no database.
  manned-adapter:
    <<: *ansp
    entrypoint: ["/manned-adapter"]
    restart: unless-stopped
    environment:
      ANSP_PROCESS: manned-adapter
      ANSP_INSTANCE: replay
      ANSP_NATS_URL: nats://nats:4222
      ANSP_NATS_CREDS: /run/secrets/nats.nk
      ANSP_MTLS_MODE: "off"
      ANSP_ADAPTER_KIND: replay
      ANSP_ADAPTER_ID: replay
      ANSP_ADAPTER_SOURCE_CLASS: ads_b
      ANSP_ADAPTER_REPLAY_FILE: /replay/two-aircraft-converging.ndjson
      ANSP_ADAPTER_REPLAY_ALLOWED: "true"
      ANSP_ADAPTER_REPLAY_LOOP: "true"
    volumes:
      - ../local/nats/manned-adapter.nk:/run/secrets/nats.nk:ro
      - ../testdata/replay:/replay:ro
    ports:
      - "127.0.0.1:58082:8080"
    depends_on:
      nats:
        condition: service_started

configs:
  initdb:
    content: |
      -- The second database of the one container (M37). Extensions and
      -- roles are created by the migrations (WP-1).
      CREATE DATABASE ansp_ts;

volumes:
  pgdata:
  natsdata:

networks:
  ansp:
