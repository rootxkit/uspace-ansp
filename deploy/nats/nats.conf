# NATS for uspace-ansp in production and on staging (deploy/compose.prod.yaml).
# One NKey user per process (api, manned-feed and each adapter); the users
# are in nats-users.conf, generated on the host next to the seeds (public
# keys only, but generated, so not in git). The store bounds come from
# the compose environment.
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_file_store: $NATS_MAX_FILE_STORE
  max_memory_store: $NATS_MAX_MEMORY_STORE
}

include ./users/nats-users.conf
