name: ci

# Lean by design (docs/WORKPACKAGES/WP-0.md): no scheduled job, every job
# bounded, superseded runs cancelled, and path filters so that a
# docs-only change runs lint-docs (and the secret scan) and nothing else.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Nothing by default; each job names what it needs (read only: no job
# here pushes, signs or writes). Every third-party action is pinned to a
# full commit SHA with its version in a comment; a moved tag cannot
# change what runs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

defaults:
  run:
    # Explicit bash runs steps with -eo pipefail.
    shell: bash

jobs:
  # Path filters for pull requests. On main and on tags every job runs.
  # A job skipped by its filter reports as skipped, which a required
  # check accepts.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      integration: ${{ github.event_name != 'pull_request' || steps.filter.outputs.integration == 'true' }}
      image: ${{ github.event_name != 'pull_request' || steps.filter.outputs.image == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.contracts == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'Makefile'
              - 'scripts/**'
              - 'api/**'
              - 'schemas/**'
              - 'docs/PLAN.md'
              - 'deploy/.env.example'
              - '.github/workflows/ci.yml'
            integration:
              - 'internal/**'
              - 'cmd/**'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            image:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'api/openapi.yaml'
            contracts:
              - 'api/**'
              - 'schemas/**'
              - 'internal/manned/dump1090/SOURCE'
              - 'scripts/check-contracts.sh'
              - 'scripts/lint-api.sh'
              - '.github/workflows/ci.yml'

  lint-docs:
    name: lint docs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Markdown line endings, whitespace, attribution and relative links
        run: make lint-docs

  build-vet-lint:
    name: build, vet, lint
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - run: make build
      - name: go vet (with the integration tag)
        run: make vet
      - name: go mod tidy is clean
        run: make tidy
      # Pinned like the Makefile's STATICCHECK_VERSION and
      # GOLANGCI_LINT_VERSION (equal to uspace-core's); change both in
      # one `ci:` commit.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      # With the integration tag: the untagged files and the integration
      # tests in one run.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          args: --build-tags integration

  test-race:
    name: test with the race detector
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race -shuffle=on
        run: go test -race -count=1 -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage
        run: |
          go tool cover -func=coverage.out | tail -n 1
          { echo '### Coverage'; echo '```'; go tool cover -func=coverage.out | tail -n 1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  generate-check:
    name: generated code is current
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go generate, then the tree is unchanged
        run: make generate-check

  integration:
    name: integration (TimescaleDB + PostGIS, NATS)
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      timescaledb:
        # Ships PostGIS and holds both databases, as on the droplet (M37).
        # Same digest as deploy/compose.yaml.
        image: timescale/timescaledb-ha:pg16@sha256:e9f34d8dd27621ec3933386eb07b70021d15b8116247362e0537bbff94ef0769
        env:
          POSTGRES_PASSWORD: ci-superuser-only-in-this-job
          POSTGRES_DB: ansp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ANSP_RELATIONAL_DSN: postgres://postgres:ci-superuser-only-in-this-job@127.0.0.1:5432/ansp?sslmode=disable
      ANSP_TIMESERIES_DSN: postgres://postgres:ci-superuser-only-in-this-job@127.0.0.1:5432/ansp_ts?sslmode=disable
      ANSP_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # A service container cannot take arguments, and NATS needs -js.
      - name: nats:2-alpine with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            nats:2-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4 -js -m 8222
          for _ in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true' && exit 0
            sleep 1
          done
          docker logs nats; exit 1
      - name: the timeseries database
        run: docker exec "${{ job.services.timescaledb.id }}" psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ansp_ts'
      - name: migrate both trees
        run: ANSP_PROCESS=api go run ./cmd/api migrate relational timeseries
      - name: make integration (fails when zero tests ran)
        run: make integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-log
          path: integration.log
          if-no-files-found: ignore

  # The contract (WP-3): api/openapi.yaml lints with the pinned
  # @redocly/cli, and every pinned sibling copy (api/clients/, the lab
  # schemas under schemas/common/) equals its source at the pinned commit
  # (M11). Each check is also shown to fail on a broken input (E-01).
  contracts:
    name: contracts (OpenAPI lint, pinned copies)
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: lint api/openapi.yaml (@redocly/cli, pinned in scripts/lint-api.sh)
        run: make lint-api
      - name: the lint fails on a warning
        run: |
          { echo 'extends:'; echo '  - recommended'; } > "$RUNNER_TEMP/recommended.yaml"
          if LINT_API_CONFIG="$RUNNER_TEMP/recommended.yaml" scripts/lint-api.sh > "$RUNNER_TEMP/lint.log" 2>&1; then
            cat "$RUNNER_TEMP/lint.log"; echo "the lint passed with warnings"; exit 1
          fi
          tail -n 2 "$RUNNER_TEMP/lint.log"
      - name: pinned copies equal their sources
        run: make check-contracts
      - name: a changed copy fails the check
        run: |
          echo '# local change' >> api/clients/cisp.yaml
          if scripts/check-contracts.sh > "$RUNNER_TEMP/contracts.log" 2>&1; then
            cat "$RUNNER_TEMP/contracts.log"; echo "a changed copy passed"; exit 1
          fi
          grep 'differs from' "$RUNNER_TEMP/contracts.log"
          git checkout -- api/clients/cisp.yaml

  vectors:
    name: knowledge vectors
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: this repository's RunOwned vectors, then uspace-core's at the pinned version
        run: |
          go test -count=1 -run Vectors ./...
          go test -count=1 -run Vectors -v github.com/rootxkit/uspace-core/... > core-vectors.log 2>&1 || { cat core-vectors.log; exit 1; }
          passed="$(grep -c '^--- PASS' core-vectors.log || true)"
          failed="$(grep -c '^--- FAIL' core-vectors.log || true)"
          echo "uspace-core vectors from this module: ${passed} passed, ${failed} failed" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -eq 0 ] || [ "$failed" -ne 0 ]; then cat core-vectors.log; exit 1; fi

  fuzz-bench:
    name: fuzz smoke and bench
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz smoke (10 s per target)
        run: make fuzz-smoke FUZZTIME=10s
      - name: bench (reported, not gated)
        run: |
          make bench
          { echo '### Bench'; echo '```'; grep '^Benchmark' bench.txt || echo 'no benchmarks yet'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: web
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # web/ arrives with WP-11; until then every step after the checkout
    # is skipped and the job says why.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: no web/ yet
        if: hashFiles('web/package.json') == ''
        run: |
          echo "web - no web/package.json yet (WP-11), nothing to check" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: hashFiles('web/package.json') != ''
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install --frozen-lockfile
        if: hashFiles('web/package.json') != ''
        run: make web-install
      - name: generated API types are current
        if: hashFiles('web/package.json') != ''
        run: make web-types
      - name: lint, then next typegen before tsc
        if: hashFiles('web/package.json') != ''
        run: make web-lint
      - name: next build
        if: hashFiles('web/package.json') != ''
        run: make web-build

  govulncheck:
    name: govulncheck
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Pinned like GOVULNCHECK_VERSION in the Makefile.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Never filtered: a secret in a docs file is still a leak.
  gitleaks:
    name: gitleaks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned (and in the Makefile); change both together.
          GITLEAKS_VERSION: "8.24.3"

  # The Go image is built, never pushed, in WP-0. WP-13 adds the push to
  # GHCR on main and tags, cosign, the SBOM and the web image.
  image:
    name: image (build only)
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Go image (api, manned-adapter, manned-feed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go
