name: ci

# Lean by design (docs/WORKPACKAGES/WP-0.md): no scheduled job, every job
# bounded, superseded runs cancelled, and path filters so that a
# docs-only change runs lint-docs (and the secret scan) and nothing else.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Nothing by default; each job names what it needs: read only, except
# images and attest, which push and sign on main and v* tags and never
# run for a pull request. Every third-party action is pinned to a full
# commit SHA with its version in a comment; a moved tag cannot change
# what runs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

defaults:
  run:
    # Explicit bash runs steps with -eo pipefail.
    shell: bash

jobs:
  # Path filters for pull requests. On main and on tags every job runs.
  # A job skipped by its filter reports as skipped, which a required
  # check accepts.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      integration: ${{ github.event_name != 'pull_request' || steps.filter.outputs.integration == 'true' }}
      image: ${{ github.event_name != 'pull_request' || steps.filter.outputs.image == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.contracts == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'Makefile'
              - 'scripts/**'
              - 'api/**'
              - 'schemas/**'
              - 'docs/PLAN.md'
              - 'deploy/.env.example'
              # Read by the tests and embedded in the binaries: a change to
              # only these must still run the tests that read them.
              - 'testdata/**'
              - '**/testdata/**'
              - 'migrations/**'
              - '.github/workflows/ci.yml'
            integration:
              - 'internal/**'
              - 'cmd/**'
              - 'migrations/**'
              - 'testdata/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            image:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'api/openapi.yaml'
              - '.github/workflows/ci.yml'
            contracts:
              - 'api/**'
              - 'schemas/**'
              - 'internal/manned/dump1090/SOURCE'
              - 'scripts/check-contracts.sh'
              - 'scripts/lint-api.sh'
              - '.github/workflows/ci.yml'

  lint-docs:
    name: lint docs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Markdown line endings, whitespace, attribution and relative links
        run: make lint-docs

  build-vet-lint:
    name: build, vet, lint
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - run: make build
      - name: go vet (with the integration tag)
        run: make vet
      - name: go mod tidy is clean
        run: make tidy
      # Pinned like the Makefile's STATICCHECK_VERSION and
      # GOLANGCI_LINT_VERSION (equal to uspace-core's); change both in
      # one `ci:` commit.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      # With the integration tag: the untagged files and the integration
      # tests in one run.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          args: --build-tags integration

  test-race:
    name: test with the race detector
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race -shuffle=on
        run: go test -race -count=1 -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage
        run: |
          go tool cover -func=coverage.out | tail -n 1
          { echo '### Coverage'; echo '```'; go tool cover -func=coverage.out | tail -n 1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  generate-check:
    name: generated code is current
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go generate, then the tree is unchanged
        run: make generate-check

  integration:
    name: integration (TimescaleDB + PostGIS, NATS)
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      timescaledb:
        # Ships PostGIS and holds both databases, as on the droplet (M37).
        # Same digest as deploy/compose.yaml.
        image: timescale/timescaledb-ha:pg16@sha256:e9f34d8dd27621ec3933386eb07b70021d15b8116247362e0537bbff94ef0769
        env:
          POSTGRES_PASSWORD: ci-superuser-only-in-this-job
          POSTGRES_DB: ansp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ANSP_RELATIONAL_DSN: postgres://postgres:ci-superuser-only-in-this-job@127.0.0.1:5432/ansp?sslmode=disable
      ANSP_TIMESERIES_DSN: postgres://postgres:ci-superuser-only-in-this-job@127.0.0.1:5432/ansp_ts?sslmode=disable
      ANSP_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # A service container cannot take arguments, and NATS needs -js.
      - name: nats:2-alpine with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            nats:2-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4 -js -m 8222
          for _ in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true' && exit 0
            sleep 1
          done
          docker logs nats; exit 1
      - name: the timeseries database
        run: docker exec "${{ job.services.timescaledb.id }}" psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ansp_ts'
      - name: migrate both trees
        run: ANSP_PROCESS=api go run ./cmd/api migrate relational timeseries
      - name: make integration (fails when zero tests ran)
        run: make integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-log
          path: integration.log
          if-no-files-found: ignore

  # The contract (WP-3): api/openapi.yaml lints with the pinned
  # @redocly/cli, and every pinned sibling copy (api/clients/, the lab
  # schemas under schemas/common/) equals its source at the pinned commit
  # (M11). Each check is also shown to fail on a broken input (E-01).
  contracts:
    name: contracts (OpenAPI lint, pinned copies)
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: lint api/openapi.yaml (@redocly/cli, pinned in scripts/lint-api.sh)
        run: make lint-api
      - name: the lint fails on a warning
        run: |
          { echo 'extends:'; echo '  - recommended'; } > "$RUNNER_TEMP/recommended.yaml"
          if LINT_API_CONFIG="$RUNNER_TEMP/recommended.yaml" scripts/lint-api.sh > "$RUNNER_TEMP/lint.log" 2>&1; then
            cat "$RUNNER_TEMP/lint.log"; echo "the lint passed with warnings"; exit 1
          fi
          tail -n 2 "$RUNNER_TEMP/lint.log"
      - name: pinned copies equal their sources
        run: make check-contracts
      - name: a changed copy fails the check
        run: |
          echo '# local change' >> api/clients/cisp.yaml
          if scripts/check-contracts.sh > "$RUNNER_TEMP/contracts.log" 2>&1; then
            cat "$RUNNER_TEMP/contracts.log"; echo "a changed copy passed"; exit 1
          fi
          grep 'differs from' "$RUNNER_TEMP/contracts.log"
          git checkout -- api/clients/cisp.yaml

  vectors:
    name: knowledge vectors
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: this repository's RunOwned vectors, then uspace-core's at the pinned version
        run: |
          go test -count=1 -run Vectors -v ./... > own-vectors.log 2>&1 || { cat own-vectors.log; exit 1; }
          passed="$(grep -c '^--- PASS' own-vectors.log || true)"
          failed="$(grep -c '^--- FAIL' own-vectors.log || true)"
          echo "this repository's vectors: ${passed} passed, ${failed} failed" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -eq 0 ] || [ "$failed" -ne 0 ]; then cat own-vectors.log; exit 1; fi
          go test -count=1 -run Vectors -v github.com/rootxkit/uspace-core/... > core-vectors.log 2>&1 || { cat core-vectors.log; exit 1; }
          passed="$(grep -c '^--- PASS' core-vectors.log || true)"
          failed="$(grep -c '^--- FAIL' core-vectors.log || true)"
          echo "uspace-core vectors from this module: ${passed} passed, ${failed} failed" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -eq 0 ] || [ "$failed" -ne 0 ]; then cat core-vectors.log; exit 1; fi

  fuzz-bench:
    name: fuzz smoke and bench
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz smoke (10 s per target)
        run: make fuzz-smoke FUZZTIME=10s
      - name: bench (reported, not gated)
        run: |
          make bench
          { echo '### Bench'; echo '```'; grep '^Benchmark' bench.txt || echo 'no benchmarks yet'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: web (types, lint, tests, build, smoke, image)
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Plain output, so the counts copied to the step summary can be read.
      NO_COLOR: "1"
      FORCE_COLOR: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install --frozen-lockfile
        run: make web-install
      - name: generated API types are current (uspace-ui-gen-api --check)
        run: make web-types
      - name: lint (kit config, no geometry import, no hard-coded string, BFF only), next typegen, tsc
        run: make web-lint
      - name: vitest
        run: |
          make web-test 2>&1 | tee web/vitest.log
          { echo '### web: vitest'; echo '```'; grep -E '^ +(Test Files|Tests) ' web/vitest.log || echo 'counts not found in vitest.log'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: next build, and the server bundle names no database, NATS or key variable
        run: |
          make web-build 2>&1 | tee web/build.log
          { echo '### web: bundle'; grep 'check-bundle-env:' web/build.log || echo 'check-bundle-env line not found in build.log'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Chromium and its system libraries
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright smoke (next start behind test/mock-api.mjs)
        run: |
          make web-e2e 2>&1 | tee web/playwright.log
          { echo '### web: Playwright'; echo '```'; grep -E '^ +[0-9]+ (passed|failed|skipped|flaky)' web/playwright.log || echo 'counts not found in playwright.log'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -qE '^ +[1-9][0-9]* passed' web/playwright.log; then echo "playwright: zero tests passed"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results
            web/playwright.log
      # The web image is built, never pushed, here; WP-13 publishes it.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: web image (build only)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: web
          file: web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  govulncheck:
    name: govulncheck
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Pinned like GOVULNCHECK_VERSION in the Makefile.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Never filtered: a secret in a docs file is still a leak.
  gitleaks:
    name: gitleaks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # The pinned binary, checked against its pinned SHA-256, with no
      # token in its environment (it needs none). Pinned like
      # GITLEAKS_VERSION in the Makefile; change both together.
      - name: gitleaks (pinned binary)
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .

  # On a pull request that touches the image, the Go image is built and
  # never pushed: no registry credential reaches pull-request code.
  image:
    name: image (build only)
    permissions:
      contents: read
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Go image (api, manned-adapter, manned-feed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go

  # On main and v* tags, after every gate (WP-13, PLAN §11), as the
  # CISP, the authority and the USSP do: the Go image pushed to
  # ghcr.io/rootxkit/uspace-ansp and the console image to
  # ghcr.io/rootxkit/uspace-ansp-web, tagged with the short SHA (and the
  # tag), each digest signed keyless with cosign and the signature
  # verified. The SBOMs are made and attached by the two jobs after this
  # one. web/Dockerfile arrives with WP-11: until it exists only the Go
  # image is published, and the step summary says so.
  images:
    name: images
    if: github.event_name == 'push'
    needs: [lint-docs, build-vet-lint, test-race, generate-check, integration, contracts, vectors, fuzz-bench, web, govulncheck, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      go_digest: ${{ steps.go.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          go_tags="ghcr.io/rootxkit/uspace-ansp:${short}"
          web_tags="ghcr.io/rootxkit/uspace-ansp-web:${short}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            go_tags+=",ghcr.io/rootxkit/uspace-ansp:${GITHUB_REF_NAME}"
            web_tags+=",ghcr.io/rootxkit/uspace-ansp-web:${GITHUB_REF_NAME}"
            version="$GITHUB_REF_NAME"
          else
            version="$short"
          fi
          if [ -f web/Dockerfile ]; then has_web=true; else has_web=false; fi
          { echo "go=$go_tags"; echo "web=$web_tags"; echo "version=$version"; echo "has_web=$has_web"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Go image (api, manned-adapter, manned-feed)
        id: go
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.go }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go
      - name: web image (Next.js standalone, web/Dockerfile)
        id: web
        if: steps.tags.outputs.has_web == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: sign the digests (cosign keyless), then verify them
        env:
          GO_DIGEST: ${{ steps.go.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          HAS_WEB: ${{ steps.tags.outputs.has_web }}
        run: |
          [ -n "$GO_DIGEST" ] || { echo "the Go image has no digest"; exit 1; }
          if [ "$HAS_WEB" = true ] && [ -z "$WEB_DIGEST" ]; then echo "the web image has no digest"; exit 1; fi
          refs=("ghcr.io/rootxkit/uspace-ansp@${GO_DIGEST}")
          if [ -n "$WEB_DIGEST" ]; then refs+=("ghcr.io/rootxkit/uspace-ansp-web@${WEB_DIGEST}"); fi
          for ref in "${refs[@]}"; do
            cosign sign --yes "$ref"
            cosign verify "$ref" \
              --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          done
          {
            echo '### Images (pushed, signed, signature verified)'
            echo
            for ref in "${refs[@]}"; do echo "- $ref"; done
            if [ -z "$WEB_DIGEST" ]; then
              echo "- ghcr.io/rootxkit/uspace-ansp-web: not published, there is no web/Dockerfile yet (WP-11)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: forget the registry credential
        if: always()
        run: docker logout ghcr.io

  # The SBOMs, apart from the push and the signing: the third-party SBOM
  # action runs with a read-only package token and no OIDC token, never
  # beside a registry credential that can push.
  sbom:
    name: SBOMs
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: read-only registry login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: SBOM of the Go image (syft, SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/rootxkit/uspace-ansp@${{ needs.images.outputs.go_digest }}
          format: spdx-json
          output-file: sbom-uspace-ansp.spdx.json
          upload-artifact: false
      - name: SBOM of the web image (syft, SPDX)
        if: needs.images.outputs.web_digest != ''
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/rootxkit/uspace-ansp-web@${{ needs.images.outputs.web_digest }}
          format: spdx-json
          output-file: sbom-uspace-ansp-web.spdx.json
          upload-artifact: false
      - name: forget the registry credential
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom-*.spdx.json
          if-no-files-found: error

  # The SBOMs attached to the digests as signed attestations: cosign
  # alone, with the write and OIDC permissions this needs.
  attest:
    name: attest SBOMs
    if: github.event_name == 'push'
    needs: [images, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: attach the SBOMs (cosign keyless)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GO_DIGEST: ${{ needs.images.outputs.go_digest }}
          WEB_DIGEST: ${{ needs.images.outputs.web_digest }}
        run: |
          echo "$TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign attest --yes --type spdxjson --predicate sbom-uspace-ansp.spdx.json "ghcr.io/rootxkit/uspace-ansp@${GO_DIGEST}"
          if [ -n "$WEB_DIGEST" ]; then
            cosign attest --yes --type spdxjson --predicate sbom-uspace-ansp-web.spdx.json "ghcr.io/rootxkit/uspace-ansp-web@${WEB_DIGEST}"
          fi
