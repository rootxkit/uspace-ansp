name: ci

# Lean by design (docs/WORKPACKAGES/WP-0.md): no scheduled job, every job
# bounded, superseded runs cancelled, and path filters so that a
# docs-only change runs lint-docs (and the secret scan) and nothing else.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

defaults:
  run:
    # Explicit bash runs steps with -eo pipefail.
    shell: bash

jobs:
  # Path filters for pull requests. On main and on tags every job runs.
  # A job skipped by its filter reports as skipped, which a required
  # check accepts.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      integration: ${{ github.event_name != 'pull_request' || steps.filter.outputs.integration == 'true' }}
      image: ${{ github.event_name != 'pull_request' || steps.filter.outputs.image == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'Makefile'
              - 'scripts/**'
              - 'api/**'
              - 'deploy/.env.example'
              - '.github/workflows/ci.yml'
            integration:
              - 'internal/**'
              - 'cmd/**'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            image:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'api/openapi.yaml'

  lint-docs:
    name: lint docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Markdown line endings, whitespace, attribution and relative links
        run: make lint-docs

  build-vet-lint:
    name: build, vet, lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - run: make build
      - name: go vet (with the integration tag)
        run: make vet
      - name: go mod tidy is clean
        run: make tidy
      # Pinned like the Makefile's STATICCHECK_VERSION and
      # GOLANGCI_LINT_VERSION (equal to uspace-core's); change both in
      # one `ci:` commit.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      # With the integration tag: the untagged files and the integration
      # tests in one run.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: --build-tags integration

  test-race:
    name: test with the race detector
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race -shuffle=on
        run: go test -race -count=1 -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage
        run: |
          go tool cover -func=coverage.out | tail -n 1
          { echo '### Coverage'; echo '```'; go tool cover -func=coverage.out | tail -n 1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  generate-check:
    name: generated code is current
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go generate, then the tree is unchanged
        run: make generate-check

  integration:
    name: integration (TimescaleDB + PostGIS, NATS)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      timescaledb:
        # Ships PostGIS and holds both databases, as on the droplet (M37).
        # Same digest as deploy/compose.yaml.
        image: timescale/timescaledb-ha:pg16@sha256:e9f34d8dd27621ec3933386eb07b70021d15b8116247362e0537bbff94ef0769
        env:
          POSTGRES_PASSWORD: ci-superuser-only-in-this-job
          POSTGRES_DB: ansp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ANSP_RELATIONAL_DSN: postgres://postgres:ci-superuser-only-in-this-job@127.0.0.1:5432/ansp?sslmode=disable
      ANSP_TIMESERIES_DSN: postgres://postgres:ci-superuser-only-in-this-job@127.0.0.1:5432/ansp_ts?sslmode=disable
      ANSP_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # A service container cannot take arguments, and NATS needs -js.
      - name: nats:2-alpine with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            nats:2-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4 -js -m 8222
          for _ in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true' && exit 0
            sleep 1
          done
          docker logs nats; exit 1
      - name: the timeseries database
        run: docker exec "${{ job.services.timescaledb.id }}" psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ansp_ts'
      - name: migrate both trees
        run: ANSP_PROCESS=api go run ./cmd/api migrate relational timeseries
      - name: make integration (fails when zero tests ran)
        run: make integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-log
          path: integration.log
          if-no-files-found: ignore

  vectors:
    name: knowledge vectors
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: this repository's RunOwned vectors, then uspace-core's at the pinned version
        run: |
          go test -count=1 -run Vectors ./...
          go test -count=1 -run Vectors -v github.com/rootxkit/uspace-core/... > core-vectors.log 2>&1 || { cat core-vectors.log; exit 1; }
          passed="$(grep -c '^--- PASS' core-vectors.log || true)"
          failed="$(grep -c '^--- FAIL' core-vectors.log || true)"
          echo "uspace-core vectors from this module: ${passed} passed, ${failed} failed" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -eq 0 ] || [ "$failed" -ne 0 ]; then cat core-vectors.log; exit 1; fi

  fuzz-bench:
    name: fuzz smoke and bench
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz smoke (10 s per target)
        run: make fuzz-smoke FUZZTIME=10s
      - name: bench (reported, not gated)
        run: |
          make bench
          { echo '### Bench'; echo '```'; grep '^Benchmark' bench.txt || echo 'no benchmarks yet'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # web/ arrives with WP-11; until then every step after the checkout
    # is skipped and the job says why.
    steps:
      - uses: actions/checkout@v4
      - name: no web/ yet
        if: hashFiles('web/package.json') == ''
        run: |
          echo "web - no web/package.json yet (WP-11), nothing to check" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        if: hashFiles('web/package.json') != ''
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install --frozen-lockfile
        if: hashFiles('web/package.json') != ''
        run: make web-install
      - name: generated API types are current
        if: hashFiles('web/package.json') != ''
        run: make web-types
      - name: lint, then next typegen before tsc
        if: hashFiles('web/package.json') != ''
        run: make web-lint
      - name: next build
        if: hashFiles('web/package.json') != ''
        run: make web-build

  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pinned like GOVULNCHECK_VERSION in the Makefile.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Never filtered: a secret in a docs file is still a leak.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned (and in the Makefile); change both together.
          GITLEAKS_VERSION: "8.24.3"

  # The Go image is built, never pushed, in WP-0. WP-13 adds the push to
  # GHCR on main and tags, cosign, the SBOM and the web image.
  image:
    name: image (build only)
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Go image (api, manned-adapter, manned-feed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go
